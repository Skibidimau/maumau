<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mau Mau</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Fehler sichtbar machen (auf dem Handy gibt es keine Entwicklerkonsole)
    window.addEventListener("error", ereignis => {
      const anzeige = document.getElementById("meldung");
      if (!anzeige) return;
      anzeige.hidden = false;
      anzeige.classList.add("sichtbar");
      const datei = (ereignis.filename || "").split("/").pop();
      anzeige.innerText = "Fehler: " + ereignis.message + (datei ? " (" + datei + ":" + ereignis.lineno + ")" : "");
    });
  </script>
</head>
<body>
  <!-- 3D-Szene (Three.js) füllt das ganze Fenster; Menü und Bedienung liegen darüber -->
  <div id="szene"></div>

  <div id="menue">
    <h1>Mau Mau</h1>

    <div class="menue-felder">
      <label>Modus
        <select id="modus" onchange="onlineMenueAktualisieren()">
          <option value="pvp">2 Spieler (an einem Gerät)</option>
          <option value="pve">Gegen Computer</option>
          <option value="online">Online (jeder an seinem Gerät)</option>
        </select>
      </label>

      <div id="onlineBereich" hidden>
        <div id="onlineVerbinden">
          <button type="button" onclick="onlineEroeffnen()">Spiel eröffnen</button>
          <div class="online-oder">oder mit Code beitreten:</div>
          <div class="online-beitreten">
            <input type="text" id="onlineCode" placeholder="Code" maxlength="8" autocomplete="off" autocapitalize="characters">
            <button type="button" onclick="onlineBeitreten()">Beitreten</button>
          </div>
        </div>
        <div id="onlineStatus">Wer eröffnet, stellt die Runde ein und fängt an.</div>
        <button type="button" id="onlineTrennen" onclick="onlineVerbindungTrennen()" hidden>Verbindung trennen</button>
      </div>
      <label>Deckanzahl (1–40)
        <input type="number" id="decks" value="4" min="1" max="40">
      </label>
      <label>Erste Hand
        <input type="number" id="anzahl" value="5" min="1">
      </label>
      <label>Teilstapel
        <input type="text" id="teilstapel" value="3,3" placeholder="z. B. 8,3,2 – leer = keine">
      </label>
    </div>

    <button id="startButton" class="haupt" onclick="rundeStarten()">Spiel starten</button>
    <p id="startFehler" hidden></p>
  </div>

  <div id="tisch" hidden>
    <div id="oberesUi">
      <div id="gegnerInfo" class="schild"></div>
      <div id="sprechblase" hidden></div>
      <div id="ablageInfo"></div>
    </div>

    <!-- Chat (nur online) -->
    <div id="chat" hidden>
      <div id="chatVerlauf"></div>
      <form id="chatFormular" onsubmit="chatSenden(event)">
        <input type="text" id="chatEingabe" maxlength="200" autocomplete="off" placeholder="Nachricht …">
        <button type="submit">Senden</button>
      </form>
    </div>

    <div id="farbwahl"></div>
    <div id="skibidi" aria-hidden="true" hidden>SKIBIDI!</div>

    <div id="unteresUi">
      <!-- Sieger-Emote (nur online, nur für den Gewinner) -->
      <div id="emotes" hidden>
        <button type="button" onclick="emoteAusloesen('salto')">🤸 Rückwärtssalto</button>
        <button type="button" onclick="emoteAusloesen('kippe')">🚬 Kippe anzünden</button>
      </div>
      <div class="leiste">
        <span id="spielerAnzeige" class="schild"></span>
        <button onclick="karteZiehen()">Karte ziehen</button>
        <button id="chatButton" type="button" onclick="chatUmschalten()" hidden>💬<span id="chatZaehler" hidden></span></button>
        <button id="neuesSpielButton" onclick="zumMenue()">Neues Spiel</button>
      </div>
      <div id="ausgabe"></div>
    </div>
  </div>

  <div id="meldung" role="alert" hidden></div>

  <script src="lib/three.min.js"></script>
  <script src="karten-daten.js"></script>
  <script src="szene3d.js"></script>
  <script src="lib/peerjs.min.js"></script>
  <script src="netz.js"></script>
  <script src="spiel.js"></script>
</body>
</html>
