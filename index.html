<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Als App auf dem Home-Bildschirm: ohne Adressleiste (iPhone kann im Browser kein Vollbild) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c140e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mau Mau">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Mau Mau</title>
  <link rel="stylesheet" href="style.css?v=2026-10-11zf">
  <script>
    // Fehler sichtbar machen (auf dem Handy gibt es keine Entwicklerkonsole)
    window.addEventListener("error", ereignis => {
      const anzeige = document.getElementById("meldung");
      if (!anzeige) return;
      anzeige.hidden = false;
      anzeige.classList.add("sichtbar");
      const datei = (ereignis.filename || "").split("/").pop();
      anzeige.innerText = "Fehler: " + ereignis.message + (datei ? " (" + datei + ":" + ereignis.lineno + ")" : "");
    });
  </script>
</head>
<body>
  <!-- 3D-Szene (Three.js) füllt das ganze Fenster; Menü und Bedienung liegen darüber -->
  <div id="szene"></div>

  <div id="menue">
    <h1>Mau Mau</h1>

    <div class="menue-felder">
      <label>Modus
        <select id="modus" onchange="onlineMenueAktualisieren(); aussehenMenueAnpassen()">
          <option value="pve">Gegen Computer</option>
          <option value="online">Online (jeder an seinem Gerät)</option>
        </select>
      </label>

      <div id="onlineBereich" hidden>
        <div id="onlineVerbinden">
          <button type="button" onclick="onlineEroeffnen()">Spiel eröffnen</button>
          <div class="online-oder">oder mit Code beitreten:</div>
          <div class="online-beitreten">
            <input type="text" id="onlineCode" placeholder="Code" maxlength="8" autocomplete="off" autocapitalize="characters">
            <button type="button" onclick="onlineBeitreten()">Beitreten</button>
          </div>
        </div>
        <div id="onlineStatus">Wer eröffnet, stellt die Runde ein. Wer anfängt, entscheidet ein Münzwurf.</div>
        <button type="button" id="onlineTrennen" onclick="onlineVerbindungTrennen()" hidden>Verbindung trennen</button>
      </div>
      <label>Deckanzahl (1–40)
        <input type="number" id="decks" value="4" min="1" max="40">
      </label>
      <label>Erste Hand
        <input type="number" id="anzahl" value="5" min="1">
      </label>
      <label>Teilstapel
        <input type="text" id="teilstapel" value="3,3" placeholder="z. B. 8,3,2 – leer = keine">
      </label>
    </div>

    <!-- Aussehen des Strichmännchens (aussehen.js); Änderungen sieht man sofort hinter dem Menü -->
    <details id="aussehenBereich">
      <summary>👕 <span id="aussehenTitel">Aussehen</span></summary>
      <div class="menue-felder aussehen-felder" onchange="aussehenGeaendert()" oninput="aussehenGeaendert()">
        <label>Figur
          <select id="aussehen-geschlecht">
            <option value="mann">Mann</option>
            <option value="frau">Frau</option>
          </select>
        </label>
        <label id="aussehenKoerbchen" hidden>Körbchengröße
          <select id="aussehen-koerbchen">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="DD">DD</option>
          </select>
        </label>
        <label>Oberteil
          <select id="aussehen-oberteil">
            <option value="keins">Keins</option>
            <option value="tshirt">T-Shirt</option>
            <option value="tanktop">Tanktop</option>
            <option value="hoodie">Hoodie</option>
            <option value="anzug">Anzug</option>
          </select>
        </label>
        <label>Farbe
          <input type="color" id="aussehen-farbe">
        </label>
        <label>Frisur
          <select id="aussehen-frisur">
            <option value="keine">Glatze</option>
            <option value="kurz">Kurz</option>
            <option value="lang">Lang</option>
            <option value="zopf">Zopf</option>
            <option value="irokese">Irokese</option>
          </select>
        </label>
        <label>Haarfarbe
          <input type="color" id="aussehen-haarfarbe">
        </label>
        <label>Kopf
          <select id="aussehen-kopf">
            <option value="keine">Nichts</option>
            <option value="cap">Cap</option>
            <option value="muetze">Mütze</option>
            <option value="krone">Krone</option>
            <option value="partyhut">Partyhut</option>
          </select>
        </label>
        <label>Hut-/Fliegenfarbe
          <input type="color" id="aussehen-hutfarbe">
        </label>
        <label>Extra
          <select id="aussehen-extra">
            <option value="keins">Nichts</option>
            <option value="sonnenbrille">Sonnenbrille</option>
            <option value="kette">Goldkette</option>
            <option value="fliege">Fliege</option>
          </select>
        </label>
        <div class="aussehen-knoepfe">
          <button type="button" onclick="aussehenZufall()">🎲 Zufällig</button>
          <button type="button" onclick="aussehenAnprobeBeenden()">✓ Fertig</button>
        </div>
      </div>
    </details>

    <button id="startButton" class="haupt" onclick="rundeStarten()">Spiel starten</button>
    <p id="startFehler" hidden></p>
  </div>

  <div id="tisch" hidden>
    <div id="oberesUi">
      <div id="gegnerInfo" class="schild"></div>
      <div id="sprechblase" hidden></div>
      <div id="ablageInfo"></div>
    </div>

    <!-- Chat (nur online): Nachrichten oben links, verblassen; Eingabe nur auf Knopfdruck (💬 oder Enter) -->
    <div id="chat" hidden>
      <div id="chatVerlauf"></div>
      <form id="chatFormular" onsubmit="chatSenden(event)" hidden>
        <input type="text" id="chatEingabe" maxlength="200" autocomplete="off" placeholder="Nachricht … (Enter)">
      </form>
    </div>

    <!-- Emotes während des Spiels -->
    <div id="emoteLeiste" hidden>
      <button type="button" onclick="spielEmote('winken')" title="Winken">👋</button>
      <button type="button" onclick="spielEmote('lachen')" title="Auslachen">😂</button>
      <button type="button" onclick="spielEmote('wuetend')" title="Wütend">😡</button>
      <button type="button" onclick="spielEmote('frech')" title="Frech">😏</button>
      <button type="button" onclick="spielEmote('schock')" title="Schock">😱</button>
      <button type="button" onclick="spielEmote('mittelfinger')" title="Mittelfinger">🖕</button>
      <button type="button" onclick="spielEmote('kippe')" title="Kippe anzünden">🚬</button>
    </div>
    <div id="eigenesEmote" aria-hidden="true" hidden></div>

    <div id="farbwahl"></div>

    <!-- Bar: Getränke und Snacks (getraenke.js); öffnet über 🍹 oder einen Klick auf den Getränkeschrank -->
    <div id="bar" hidden>
      <div class="bar-kopf"><span>🍹 Getränke &amp; Snacks</span><button type="button" onclick="barSchliessen()" aria-label="Schließen">✕</button></div>
      <div id="barInhalt"></div>
    </div>
    <div id="skibidi" aria-hidden="true" hidden>SKIBIDI!</div>

    <div id="unteresUi">
      <!-- Siegesfeier: für jeden menschlichen Gewinner -->
      <div id="emotes" hidden>
        <span class="emotes-titel">Sieg feiern:</span>
        <button type="button" onclick="emoteAusloesen('salto')">🤸 Rückwärtssalto</button>
        <button type="button" onclick="emoteAusloesen('kippe')">🚬 Kippe</button>
        <button type="button" onclick="emoteAusloesen('mittelfinger')">🖕 Mittelfinger</button>
      </div>
      <div class="leiste">
        <span id="spielerAnzeige" class="schild"></span>
        <button onclick="karteZiehen()">Karte ziehen</button>
        <button id="barButton" type="button" onclick="barUmschalten()" title="Getränke &amp; Snacks">🍹</button>
        <button id="emoteButton" type="button" onclick="emoteLeisteUmschalten()" hidden>😀</button>
        <button id="chatButton" type="button" onclick="chatUmschalten()" hidden>💬<span id="chatZaehler" hidden></span></button>
        <button id="vollbildButton" type="button" onclick="vollbildUmschalten()" title="Vollbild" hidden>⛶</button>
        <button id="neuesSpielButton" onclick="zumMenue()">Neues Spiel</button>
      </div>
      <div id="ausgabe"></div>
    </div>
  </div>

  <div id="meldung" role="alert" hidden></div>

  <!-- ?v=… zwingt Browser (v. a. Handys) nach Updates zum Neuladen – bei jeder Änderung hochzählen -->
  <script src="lib/three.min.js"></script>
  <script src="karten-daten.js?v=2026-10-11zf"></script>
  <script src="wandbilder-daten.js?v=2026-10-11zf"></script>
  <script src="szene3d.js?v=2026-10-11zf"></script>
  <script src="lib/peerjs.min.js"></script>
  <script src="netz.js?v=2026-10-11zf"></script>
  <script src="aussehen.js?v=2026-10-11zf"></script>
  <script src="getraenke.js?v=2026-10-11zf"></script>
  <script src="spiel.js?v=2026-10-11zf"></script>
</body>
</html>
